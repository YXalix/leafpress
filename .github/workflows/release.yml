name: release

on:
  push:
    branches: [main]   # iteration phase: overwrite the release ROLLING_TAG points to
    tags: ["v*"]       # once stable: each tag gets its own release
    paths-ignore:      # doc-only changes do not trigger builds
      - "**.md"
      - "LICENSE-*"
  workflow_dispatch:

env:
  ROLLING_TAG: v0.1.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo leptos build --release
          # target/site is generated by the wasm step and may finish after the server binary build;
          # run again so build.rs detects the asset change and embeds the latest static assets into the binary
          cargo build --release --features ssr

      - name: Package
        run: |
          # filenames carry no version: the /releases/latest/download/ fixed link stays directly usable
          cp target/release/leafpress leafpress-${{ matrix.target }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafpress-${{ matrix.target }}
          path: leafpress-*
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tag push → standalone release for that tag; otherwise → overwrite the rolling release
          TAG="$ROLLING_TAG"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release create "$TAG" --title "$TAG" --notes "Rolling dev build: rebuilt on every push to main during early iteration." || true
          gh release upload "$TAG" leafpress-* --clobber
